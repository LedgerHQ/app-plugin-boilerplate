name: Build and run functional tests using ragger entry point

# This workflow will build the app and then run functional tests using the Ragger framework upon Speculos emulation.
# It calls a reusable workflow developed by Ledger's internal developer team to build the application and upload the
# resulting binaries.
# It then calls another reusable workflow to run the Ragger tests on the compiled application binary.
#
# This workflow is itself written as a reusable workflow so it can be triggered by itself (file
# build_and_functional_tests.yml), or triggered by external repositories CI (used by various non regression workflows
# we have). You do not need to keep this split, so you can merge this file and build_and_functional_tests.yml on your
# fork

on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: 'develop'
        type: string

      test_filter:
        required: false
        default: '""'
        type: string

      regenerate_snapshots:
        description: 'Clean snapshots, regenerate them, commit the changes in a branch, and open a PR'
        required: false
        default: false
        type: boolean

jobs:
  build_plugin:
    name: Build plugin using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      app_repository: LedgerHQ/app-plugin-boilerplate
      app_branch_name: ${{ inputs.branch }}
      upload_app_binaries_artifact: plugin_binaries
      flags: "DEBUG=1"

  build_develop_ethereum_app:
    name: Build Ethereum app using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      app_repository: LedgerHQ/app-ethereum
      app_branch_name: develop
      flags: "DEBUG=1 CAL_TEST_KEY=1"
      upload_app_binaries_artifact: ethereum_build_develop

  ragger_tests_with_ethereum_develop:
    name: Run ragger tests using the reusable workflow
    needs:
      - build_plugin
      - build_develop_ethereum_app
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      app_repository: LedgerHQ/app-plugin-boilerplate
      app_branch_name: ${{ inputs.branch }}
      download_app_binaries_artifact: plugin_binaries
      additional_app_binaries_artifact: ethereum_build_develop
      additional_app_binaries_artifact_dir: ./tests/.test_dependencies/ethereum/build
      test_filter: ${{ inputs.test_filter }}
      regenerate_snapshots: ${{ inputs.regenerate_snapshots }}
