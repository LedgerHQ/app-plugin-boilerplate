[tool:pytest]
addopts = --strict-markers -m "not canary"
markers =
    canary: negative control of the golden comparison (excluded by default; run with -m canary)
timeout = 300

[pylint]
disable = C0114,  # missing-module-docstring
          C0115,  # missing-class-docstring
          C0116,  # missing-function-docstring
          C0103,  # invalid-name
          R0801,  # duplicate-code
          R0913   # too-many-arguments
max-line-length=100
extension-pkg-whitelist=hid

[pycodestyle]
max-line-length = 100

[mypy-hid.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
